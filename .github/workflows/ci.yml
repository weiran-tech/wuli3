name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build, test and analyse
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      # build 串联编译、单元测试、Checkstyle、Spotless、SpotBugs、Forbidden APIs、
      # Error Prone/NullAway、JaCoCo 覆盖率校验、javadoc(-Werror) 和打包；
      # :build-logic:test 运行约定插件自身的测试。
      - name: Run build and quality gates
        run: ./gradlew --no-daemon clean build :build-logic:test --continue

      - name: Upload reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-reports
          path: |
            **/build/reports/tests/
            **/build/reports/checkstyle/
            **/build/reports/spotbugs/
            **/build/reports/jacoco/
          if-no-files-found: ignore

  bom-consumers:
    name: Verify published BOM consumers
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      # 先把 BOM 与全部组件发布到临时仓库，再用独立的 Gradle 和 Maven 消费者
      # 验证能通过 BOM 无版本引入并完成编译与运行。
      - name: Verify BOM consumers
        run: ./gradlew --no-daemon verifyBomConsumers apiCompatibilityCheck --warning-mode fail --continue

  example-service:
    name: Verify generated service template
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      # examples/order-service 通过 mavenLocal 解析 wuli3 组件与 DDD 约定插件。
      - name: Publish to local Maven repository
        run: ./gradlew --no-daemon publishToMavenLocal :build-logic:publishToMavenLocal

      # check 覆盖 Shared Kernel 依赖白名单校验和 ArchUnit 模块边界测试。
      - name: Run example service checks
        working-directory: examples/order-service
        run: ./gradlew --no-daemon clean check --continue
